name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memory_test
          POSTGRES_PASSWORD: memory_test
          POSTGRES_DB: memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memory_test -d memory_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"
          python-version: ${{ matrix.python-version }}
      - name: Install pinned dependencies
        run: uv sync --locked --extra server
      - name: Run offline tests
        env:
          TEST_DATABASE_URL: postgresql://memory_test:memory_test@127.0.0.1:5432/memory_test
        run: uv run --offline --extra server pytest -q
      - name: Verify published answer evidence
        run: uv run --offline python -m evals.verify_answer_evidence
      - name: Verify published GPT-4o evaluator results
        run: uv run --offline python -m evals.verify_official_gpt4o
      - name: Lint
        run: uv run --offline ruff check .
      - name: Format
        run: uv run --offline ruff format --check .
