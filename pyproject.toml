[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "langgraph-lancedb-memory"
version = "0.1.0"
description = "A local LangGraph memory agent with LanceDB hybrid retrieval and reproducible evals"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{ name = "Shreyas Gosavi" }]
dependencies = [
  "fastembed==0.9.1",
  "lancedb==0.41.0",
  "langgraph==1.2.24",
  "pyarrow==26.0.1",
  "pydantic==2.14.4",
]

[project.optional-dependencies]
openai = ["langchain-openai==1.8.5"]
anthropic = ["langchain-anthropic==1.7.11"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[project.scripts]
agent-memory = "agent_memory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
